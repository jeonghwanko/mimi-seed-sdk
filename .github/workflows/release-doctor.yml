name: Release Doctor
on:
  workflow_call:
    inputs:
      project-path:
        type: string
        default: '.'
      cli-version:
        description: 'Exact stable version for reproducible checks; latest for scheduled policy refreshes'
        type: string
        default: 'latest'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check repository evidence
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
          CLI_VERSION: ${{ inputs.cli-version }}
          MIMI_SEED_LANG: en
          MIMI_SEED_TELEMETRY: '0'
        run: |
          if [[ ! "$CLI_VERSION" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo 'Use latest or an exact stable version.' >&2
            exit 2
          fi
          npx -y "mimi-seed@$CLI_VERSION" check --local --path "$PROJECT_PATH" --fail-on-blocker
