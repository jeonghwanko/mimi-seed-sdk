name: Plugin Scanner

# HOL plugin-scanner — the gate awesome-ai-plugins applies to listed plugins (score >= 80, no high/critical).
# It runs on a clean checkout: no node_modules / dist, so it sees what the listing's central scan sees.
# Reproduce locally on a clean export:  uvx plugin-scanner lint . --format text
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: hashgraph-online/ai-plugin-scanner-action@c57f042a11fe3b7f5849ed95757888561ae95368 # v1.2.738 (plugin-scanner 3.15.5)
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          pr_comment: off # no GITHUB_TOKEN is passed; results go to the step summary
