name: CI

on:
  push:
    branches: [main, master]
    # 릴리스는 `v*` 태그 푸시로만 한다 (main 푸시·PR 은 테스트만). 아래 publish 잡 참고.
    tags: ['v*']
  pull_request:

# 같은 ref 의 run 을 직렬화 — 연속 푸시 2건이 같은 패키지를 동시에 publish 하다
# npm 409 packument 경합으로 죽은 실사고(2026-07-09)의 재발 방지.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# 기본은 읽기 전용. 쓰기 권한(태그·Release, OIDC)은 publish 잡에만 준다.
permissions:
  contents: read

jobs:
  # 루트 가드 — 패키지 잡은 working-directory 가 packages/<pkg> 라 루트 스크립트를
  # 절대 실행하지 않는다. plugins/mimi-seed(Codex 배포본) 드리프트를 잡는 테스트는
  # 어느 패키지 스위트에도 없으므로, 이 잡이 없으면 CLAUDE.md 규칙 #8(`plugin:sync`
  # 후 재생성본 커밋)은 순전히 사람 손에만 의존한다. OS 매트릭스 밖에 있어서 한 번만 돈다.
  # plugin:check 의 첫 단계는 `gen-docs --check` — tool-manifest.json 에서 생성되는 문서 블록
  # (tool-catalog · README 도구 표 · agent-guide select: 배치)이 최신인지 본다.
  #
  # build-test 가 이 잡에 needs 로 매달려 있다 — 드리프트난 커밋은 테스트 전에 막는다.
  repo-guards:
    name: repo guards (agent-guide · codex plugin · versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # 루트 package.json 은 의존성이 없고 scripts/*.mjs 는 node 빌트인만 쓴다 → install 불필요.
      # .nvmrc(하한선)로 돌려 스크립트 자체도 최저 지원 버전에서 검증한다.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Lint workflows and shell scripts
        run: |
          shellcheck --version
          find .github scripts -type f -name '*.sh' -exec shellcheck {} +
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/$archive" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - run: npm run plugin:check
      - run: node --test scripts/release-channel.test.mjs scripts/gen-docs.test.mjs scripts/changelog-check.test.mjs scripts/shrinkwrap.test.mjs scripts/release-marketplace.test.mjs
      - run: bash scripts/publish-if-new.test.sh

  # 테스트 전용 — 이 잡은 절대 publish 하지 않는다 (publish 잡이 따로 있다).
  build-test:
    name: ${{ matrix.package }} (node ${{ matrix.node }}, ${{ matrix.os }})
    needs: repo-guards
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: [cli, mcp-server]
        # 하한선(.nvmrc = engines.node = 22)과 상용 버전 양쪽. 22 를 빼면
        # "engines 는 >=22 인데 아무도 22 에서 돌려본 적 없음" 상태가 된다.
        node: [22, 24]
        os: [ubuntu-latest]
        # Windows 는 상용 버전 하나만. 사용자 상당수가 Windows 이고(PATH·.cmd shim·경로
        # 구분자·CRLF), 그 경로는 리눅스 러너에서 절대 실행되지 않는다.
        # macOS 도 상용 버전 하나만. App Store Connect·iOS 쪽 사용자는 사실상 전부 macOS 인데,
        # 리눅스 러너가 밟지 않는 경로가 있다: cli/src/mcp-restart.ts 의 darwin 분기(lsof 로 프로세스
        # 작업 폴더 조회), tmpdir 이 /var → /private/var 심볼릭 링크라 realpath 와 경로 비교가
        # 어긋나는 것, 대소문자를 구분하지 않는 APFS.
        include:
          - { package: cli, node: 24, os: windows-latest }
          - { package: mcp-server, node: 24, os: windows-latest }
          - { package: cli, node: 24, os: macos-latest }
          - { package: mcp-server, node: 24, os: macos-latest }
    defaults:
      run:
        shell: bash
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      # `npm install` (not `npm ci`): @emnapi/* are optional deps of
      # platform-specific native packages (rolldown/oxc), and npm omits the
      # Linux variants from a Windows-generated lockfile — `npm ci` then fails
      # the strict sync check. `npm install` reconciles per-platform, which is
      # also what makes the same lockfile install cleanly on the Windows leg.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Keep this name stable in main branch protection as the matrix changes.
  required-ci:
    name: Required CI
    needs: [repo-guards, build-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check repository guards and build matrix
        env:
          REPO_GUARDS: ${{ needs.repo-guards.result }}
          BUILD_TEST: ${{ needs.build-test.result }}
        run: |
          printf 'Repository guards: %s\nBuild and test: %s\n' "$REPO_GUARDS" "$BUILD_TEST"
          [[ "$REPO_GUARDS" == success && "$BUILD_TEST" == success ]]

  # 배포는 **모든** 테스트 레그(OS·Node·패키지 전부)와 repo-guards 가 녹색일 때만, 한 잡에서
  # 순서대로 한다: mcp-server 먼저, cli 나중. 예전엔 매트릭스 레그가 각자 자기 패키지를
  # publish 해서(fail-fast: false) mcp-server 가 실패해도 cli 만 npm 에 올라가는 반쪽 릴리스가
  # 가능했다. cli 는 mcp-server 의 bin 을 자기 버전으로 고정해 npx 로 부르므로(mcp-bin.ts),
  # 짝이 되는 mcp-server 가 없으면 그 cli 는 설치 직후부터 깨진다. 같은 잡의 연속 step 이라
  # mcp-server step 이 실패하면 cli step 은 실행되지 않는다.
  #
  # 트리거: `v*` 태그 푸시만. main 푸시는 테스트만 하고 배포하지 않는다 — 예전(main 푸시 =
  # 즉시 latest)엔 하루 12번 릴리스·회귀 수정 연쇄가 그대로 사용자에게 나갔다. 태그는 루트
  # package.json 버전과 같아야 하고 main 에 이미 병합된 커밋을 가리켜야 한다 (아래 첫 step).
  # 프리릴리스(`-beta.N`/`-next.N`)는 scripts/release-channel.mjs 가 해당 dist-tag 로 보낸다.
  publish:
    name: publish (mcp-server → cli)
    needs: required-ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # 워크플로 concurrency 는 ref 별이라 태그 두 개(v0.20.0, v0.20.1)를 연달아 푸시하면
    # publish 가 동시에 돈다 — 2026-07-09 packument 409 경합의 재발 경로. publish 만 전역 직렬화.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release + 태그 생성
      id-token: write   # npm trusted publishing + provenance
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # 태그 커밋이 origin/main 조상인지 확인하려면 전체 이력이 필요

      # 태그 ↔ 버전 ↔ main 정합성. 하나라도 어긋나면 아무것도 publish 하지 않는다.
      - name: Verify release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match root package.json version v$VERSION"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main — merge the release PR first"
            exit 1
          fi
          node scripts/version.mjs --check

      # 빌드는 하한선(22, 테스트 매트릭스에 포함)에서 — 산출물이 테스트된 런타임으로 만들어진다.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/mcp-server/package-lock.json
            packages/cli/package-lock.json

      - name: Build mcp-server
        working-directory: packages/mcp-server
        run: npm install --no-audit --no-fund && npm run build

      - name: Build cli
        working-directory: packages/cli
        run: npm install --no-audit --no-fund && npm run build

      # npm trusted publisher: jeonghwanko/mimi-seed-sdk, workflow ci.yml.
      # Node 24 bundles npm 11 with OIDC authentication support. Test runtimes stay unchanged.
      - name: Set up trusted publishing runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # mcp-server의 게시와 npm 설치 검증이 모두 끝나야 CLI 배포를 시작한다.
      - name: Publish and verify mcp-server
        working-directory: packages/mcp-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ../../.github/scripts/publish-if-new.sh mcp-server

      - name: Publish and verify cli
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ../../.github/scripts/publish-if-new.sh cli
